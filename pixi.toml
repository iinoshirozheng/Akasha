[workspace]
authors = ["Ray <iinoshirozheng@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "Akasha"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-native-worker = "bash -c 'mkdir -p .build/native; if [ \"$(uname -s)\" = Darwin ]; then clang -std=c11 -Wall -Wextra -Werror -dynamiclib native/maintenance_worker.c -o .build/native/libakasha_worker.so; else cc -std=c11 -Wall -Wextra -Werror -fPIC -shared -pthread native/maintenance_worker.c -o .build/native/libakasha_worker.so; fi'"
test-mojo = { cmd = "bash -c 'for test_file in tests/mojo/test_*.mojo; do mojo run -I src \"$test_file\" || exit 1; done'", depends-on = ["build-native-worker"] }
test-gpu = "bash -c 'for test_file in tests/gpu/test_*.mojo; do mojo run -I src \"$test_file\" || exit 1; done'"
build-python = "mojo build --emit shared-lib -I src src/bindings/python_module.mojo -o python/akashadb/_kernel.so"
build-c = { cmd = "bash -c 'set -eu; mkdir -p .build/c; if [ \"$(uname -s)\" = Darwin ]; then extension=dylib; else extension=so; fi; mojo build --emit shared-lib -I src src/bindings/c_api.mojo -o .build/c/libakasha_c.$extension'", depends-on = ["build-native-worker"] }
test-c = { cmd = "bash -c 'set -eu; cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/c/test_akasha_c_api.c -L.build/c -lakasha_c -o .build/c/test_akasha_c_api; if [ \"$(uname -s)\" = Darwin ]; then DYLD_LIBRARY_PATH=.build/c .build/c/test_akasha_c_api; else LD_LIBRARY_PATH=.build/c .build/c/test_akasha_c_api; fi'", depends-on = ["build-c"] }
test-python = { cmd = "pytest tests/python -q", depends-on = ["build-python", "build-native-worker"], env = { PYTHONPATH = "python:." } }
test = { depends-on = ["test-mojo", "test-python"] }
test-crash = "bash -c 'for test_file in tests/crash/test_*.mojo; do mojo run -I src \"$test_file\" || exit 1; done'"
test-distributed = { cmd = "pytest tests/distributed -q", depends-on = ["build-python", "build-native-worker"], env = { PYTHONPATH = "python:." } }
build-mojo = { cmd = "mkdir -p .build && mojo build -I src examples/smoke.mojo -o .build/akasha-smoke && mojo build -I src examples/persistent_collection.mojo -o .build/akasha-persistent && mojo build -I src examples/configured_hnsw.mojo -o .build/akasha-configured-hnsw", depends-on = ["build-native-worker"] }
build = { depends-on = ["build-mojo", "build-python"] }
smoke = "mojo run -I src examples/smoke.mojo"
example-persistent = "mojo run -I src examples/persistent_collection.mojo"
example-hnsw = "mojo run -I src examples/configured_hnsw.mojo"
serve = { cmd = "uvicorn apps.server.main:app --reload", env = { PYTHONPATH = "python:." } }
bench-distance = "mojo run -I src benchmarks/mojo/distance_bench.mojo"
bench-flat = "mojo run -I src benchmarks/mojo/flat_bench.mojo"
bench-hnsw = "mojo run -I src benchmarks/mojo/hnsw_bench.mojo"
bench-hnsw-quality = "mojo run -I src benchmarks/mojo/hnsw_quality.mojo"
check-hnsw-quality = "mojo run -I src benchmarks/mojo/hnsw_quality.mojo -- --smoke"
bench-metadata = "mojo run -I src benchmarks/mojo/metadata_bench.mojo"
bench-compaction = "mojo run -I src benchmarks/mojo/compaction_bench.mojo"
bench-batch = "mojo run -I src benchmarks/mojo/batch_query_bench.mojo"
bench-phase11 = { cmd = "mojo run -I src benchmarks/mojo/phase11_bench.mojo", depends-on = ["build-native-worker"] }
bench-phase12 = "mojo run -I src benchmarks/mojo/phase12_bench.mojo"
bench-phase13-gpu = "mojo run -I src benchmarks/mojo/phase13_gpu_bench.mojo"

[dependencies]
mojo = "==1.0.0"
max-core = "==26.5.0"
python = "==3.11"
fastapi = ">=0.141.1,<0.142"
uvicorn = ">=0.52.4,<0.53"
pytest = ">=9.1.1,<10"
hypothesis = ">=6.165.10,<7"
numpy = ">=2.4.6,<3"
pyarrow = ">=21,<22"
